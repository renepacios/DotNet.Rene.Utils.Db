name: CI

on:
  push:
    branches: [ "develop","main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch: #to test


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # - name: Setup .NET
    #   uses: actions/setup-dotnet@v4
    #   with:
    #     dotnet-version: 8.0.x

    - name: Setup .NET SDK 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Download integration test database
      run: |
        mkdir -p resources/backups
        curl --fail --location --retry 3 \
          https://github.com/microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorksLT2022.bak \
          --output resources/backups/AdventureWorksLT2022.bak
    - name: Test
      run: dotnet test --no-build --verbosity normal
